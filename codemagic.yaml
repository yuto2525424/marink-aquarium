# Codemagic（Macを持っていなくても、ネット上のMacでiPhoneアプリを組み立てるサービス）の設定
#
# 事前に Codemagic の画面で、次の2つを済ませておく（手順は app/STORE.md）
#   1. App Store Connect の APIキーを登録し、名前を「MARINK_ASC」にする
#   2. 署名用の証明書（iOS Distribution）を作成し、プロビジョニングプロファイルを取得する
#
# このファイルはリポジトリのいちばん上に置く必要があります。

workflows:
  ios-testflight:
    name: MARINK水族館 iOS（TestFlightへ送る）
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: MARINK_ASC
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: io.github.yuto2525424.marinkaquarium
      node: 22
      xcode: latest
    # 自動で動くのは「app-v1.3」のような名前のタグを GitHub に送ったときだけ（サイトだけの更新では動かない）
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'app-v*'
          include: true
    scripts:
      - name: 部品のインストール
        script: |
          cd app
          npm ci
      - name: ゲーム本体をアプリに入れる
        script: |
          cd app
          npm run sync
      - name: タグからバージョン番号を決める（app-v1.3 → 1.3）
        script: |
          if [ -n "$CM_TAG" ]; then
            V="${CM_TAG#app-v}"
            echo "$V" | grep -Eq '^[0-9]+(\.[0-9]+){1,2}$' || { echo "タグの形が違います: $CM_TAG"; exit 1; }
            sed -i '' "s/MARKETING_VERSION = [0-9.]*;/MARKETING_VERSION = $V;/g" app/ios/App/App.xcodeproj/project.pbxproj
          fi
          grep -m1 "MARKETING_VERSION" app/ios/App/App.xcodeproj/project.pbxproj
      - name: ビルド番号を毎回1つ上げる
        script: |
          cd app/ios/App
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*;/CURRENT_PROJECT_VERSION = $BUILD_NUMBER;/g" App.xcodeproj/project.pbxproj
      - name: 署名の設定
        script: xcode-project use-profiles --project app/ios/App/App.xcodeproj
      - name: アプリ（ipa）を組み立てる
        script: |
          xcode-project build-ipa \
            --project app/ios/App/App.xcodeproj \
            --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        # 届いたら、そのまま App Store の審査に出す。承認されたら自動で公開。「新機能」の文は release_notes.json
        submit_to_app_store: true
        release_type: AFTER_APPROVAL
        cancel_previous_submissions: true
